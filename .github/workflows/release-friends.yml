name: Build and publish official Arab Market release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag (first release: v1.0-friends)"
        required: true
        default: "v1.0-friends"
        type: string
  push:
    branches:
      - main
    paths:
      - ".github/workflows/release-friends.yml"
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve release version
        id: version
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || (startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.0-friends') }}
        run: |
          VERSION="${RELEASE_TAG#v}"
          VERSION="${VERSION%%-*}"
          if [[ "$VERSION" != *.*.* ]]; then VERSION="$VERSION.0"; fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Validate required release secrets
        env:
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for name in SUPABASE_ANON_KEY ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing required GitHub Actions secret: $name"
              exit 1
            fi
          done
          case "$SUPABASE_ANON_KEY" in
            sb_secret_*|*service_role*) echo "::error::A secret/service_role key must never be embedded in a mobile app."; exit 1 ;;
          esac

      - name: Generate Android project, app identity, icon and signing config
        working-directory: flutter_app
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          flutter create --platforms=android --project-name jandali_market_native _android_scaffold
          cp -R _android_scaffold/android ./android
          cp _android_scaffold/.metadata .metadata
          rm -rf _android_scaffold
          mkdir -p android/app/src/main/res/drawable
          python3 - <<'PY'
          from pathlib import Path
          import re
          gradle = Path("android/app/build.gradle.kts")
          if not gradle.exists():
              raise SystemExit("Expected Kotlin Gradle file is missing")
          text = gradle.read_text()
          text = re.sub(r'namespace = "[^"]+"', 'namespace = "com.jandali.arabmarket"', text, count=1)
          text = re.sub(r'applicationId = "[^"]+"', 'applicationId = "com.jandali.arabmarket"', text, count=1)
          if 'applicationId = "com.jandali.arabmarket"' not in text:
              raise SystemExit("Could not set official applicationId")
          signing = """
              signingConfigs {
                  create("release") {
                      storeFile = file(System.getenv("ANDROID_KEYSTORE_PATH")!!)
                      storePassword = System.getenv("ANDROID_KEYSTORE_PASSWORD")
                      keyAlias = System.getenv("ANDROID_KEY_ALIAS")
                      keyPassword = System.getenv("ANDROID_KEY_PASSWORD")
                  }
              }
          """
          if "signingConfigs {" not in text:
              text = text.replace("    buildTypes {", signing + "\n    buildTypes {", 1)
          text = text.replace('signingConfig = signingConfigs.getByName("debug")', 'signingConfig = signingConfigs.getByName("release")')
          release_start = text.find('release {')
          if release_start < 0:
              raise SystemExit("Release build type not found")
          text = text[:release_start] + text[release_start:].replace('isMinifyEnabled = false', 'signingConfig = signingConfigs.getByName("release")\n            isMinifyEnabled = false', 1)
          gradle.write_text(text)
          manifest = Path("android/app/src/main/AndroidManifest.xml")
          m = manifest.read_text()
          m = re.sub(r'android:label="[^"]+"', 'android:label="السوق العربي"', m, count=1)
          m = re.sub(r'<application', '<application android:icon="@drawable/market_launcher"', m, count=1)
          deep_link = """
                  <intent-filter>
                      <action android:name="android.intent.action.VIEW" />
                      <category android:name="android.intent.category.DEFAULT" />
                      <category android:name="android.intent.category.BROWSABLE" />
                      <data android:scheme="jandaliarabmarket" android:host="login-callback" />
                  </intent-filter>
          """
          if 'android:scheme="jandaliarabmarket"' not in m:
              m = m.replace('</activity>', deep_link + '\\n            </activity>', 1)
          if 'android:scheme="jandaliarabmarket"' not in m:
              raise SystemExit("Email confirmation deep-link filter was not inserted")
          manifest.write_text(m)
          icon = Path("android/app/src/main/res/drawable/market_launcher.xml")
          icon.write_text("""<vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp" android:height="108dp" android:viewportWidth="108" android:viewportHeight="108">
              <path android:fillColor="#147A3C" android:pathData="M0,0h108v108h-108z"/>
              <path android:fillColor="#FFFFFF" android:pathData="M10,47L36,24L62,47L57,53L36,35L15,53z M17,49h38v35h-38z"/>
              <path android:fillColor="#147A3C" android:pathData="M31,64h11v20h-11z"/>
              <path android:fillColor="#BDEBC8" android:pathData="M45,57h7v8h-7z"/>
              <path android:fillColor="#FFD34E" android:pathData="M62,58h26c4,0 7,3 7,7v11h-40v-11c0,-4 3,-7 7,-7z M66,58l6,-9h12l7,9z"/>
              <path android:fillColor="#FFFFFF" android:pathData="M55,75h42v5h-42z"/>
              <path android:fillColor="#FFFFFF" android:pathData="M59,80a6,6 0,1 0,12 0a6,6 0,1 0,-12 0 M82,80a6,6 0,1 0,12 0a6,6 0,1 0,-12 0"/>
              <path android:fillColor="#F7FFF8" android:pathData="M62,83h33l-5,13h-23z"/>
          </vector>""")
          PY
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > release.keystore
          echo "ANDROID_KEYSTORE_PATH=$PWD/release.keystore" >> "$GITHUB_ENV"

      - name: Install dependencies and analyze
        working-directory: flutter_app
        run: |
          flutter pub get
          flutter analyze --no-fatal-infos

      - name: Build signed production APK
        working-directory: flutter_app
        env:
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/flutter_app/release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          flutter build apk --release \
            --build-name=${{ steps.version.outputs.version }} \
            --build-number=${{ github.run_number }} \
            --dart-define=SUPABASE_URL=https://xhyobwcaljmoakyvjajb.supabase.co \
            --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY"
          cp build/app/outputs/flutter-apk/app-release.apk ../arab-market.apk

      - name: Publish GitHub Release with stable APK asset name
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || (startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.0-friends') }}
          name: السوق العربي - النسخة الرسمية للأصدقاء
          generate_release_notes: true
          files: arab-market.apk
