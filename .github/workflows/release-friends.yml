name: Build Arab Market HTML wrapper signed APK or AAB

on:
  workflow_dispatch:
    inputs:
      format:
        description: "Build format"
        required: true
        type: choice
        options:
          - apk
          - aab
        default: apk

permissions:
  contents: read

jobs:
  release-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # The HTML wrapper loads the already-hosted HTML marketplace.
      # Supabase is configured by that hosted page; this Android build needs
      # no SUPABASE_ANON_KEY secret and performs no legacy-JWT validation.
      - name: Require permanent Android signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing required GitHub Actions secret: $name. Refusing to build with a different/debug signing key."
              exit 1
            fi
          done
      - name: Generate Android project, app identity, icon and signing config
        working-directory: html_wrapper
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          flutter create --platforms=android --org com.jandali --project-name arabmarket _android_scaffold
          cp -R _android_scaffold/android ./android
          cp _android_scaffold/.metadata .metadata
          MAIN_ACTIVITY=$(find android/app/src/main -name MainActivity.kt -print -quit)
          test -n "$MAIN_ACTIVITY"
          grep -q '^package com.jandali.arabmarket$' "$MAIN_ACTIVITY" || { echo 'MainActivity package mismatch'; exit 1; }
          rm -rf _android_scaffold
          mkdir -p android/app/src/main/res/drawable
          cat > android/app/src/main/res/drawable/market_launcher.xml <<'XML'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path android:fillColor="#16834A" android:pathData="M0,0h108v108h-108z"/>
              <path android:fillColor="#FFFFFF" android:pathData="M12,48L38,25L64,48V78H45V59H31V78H12Z"/>
              <path android:fillColor="#FFFFFF" android:pathData="M61,61h31l5,10v10H58V70z"/>
              <path android:fillColor="#16834A" android:pathData="M68,65h18l4,6H64z"/>
              <path android:fillColor="#FFFFFF" android:pathData="M66,81a5,5 0,1 0,10 0a5,5 0,1 0,-10 0M86,81a5,5 0,1 0,10 0a5,5 0,1 0,-10 0"/>
              <path android:fillColor="#FFFFFF" android:pathData="M71,38h22v3H71zM74,43h16v3H74zM77,48h10v3H77z"/>
          </vector>
          XML
          python3 - <<'PY'
          from pathlib import Path
          import re
          import os
          gradle = Path("android/app/build.gradle.kts")
          if not gradle.exists():
              raise SystemExit("Expected Kotlin Gradle file is missing")
          text = gradle.read_text()
          text = re.sub(r'namespace = "[^"]+"', 'namespace = "com.jandali.arabmarket"', text, count=1)
          text = re.sub(r'applicationId = "[^"]+"', 'applicationId = "com.jandali.arabmarket"', text, count=1)
          if 'applicationId = "com.jandali.arabmarket"' not in text:
              raise SystemExit("Could not set official applicationId")
          # Wire the permanent keystore into the generated Android release signing config.
          signing = '''
              signingConfigs {
                  create("release") {
                      storeFile = file(System.getenv("ANDROID_KEYSTORE_PATH") ?: error("ANDROID_KEYSTORE_PATH missing"))
                      storePassword = System.getenv("ANDROID_KEYSTORE_PASSWORD") ?: error("ANDROID_KEYSTORE_PASSWORD missing")
                      keyAlias = System.getenv("ANDROID_KEY_ALIAS") ?: error("ANDROID_KEY_ALIAS missing")
                      keyPassword = System.getenv("ANDROID_KEY_PASSWORD") ?: error("ANDROID_KEY_PASSWORD missing")
                  }
              }
          '''
          if "signingConfigs {" not in text:
              text = text.replace("android {", "android {\n" + signing, 1)
          release_block = re.search(r'(buildTypes\s*\{\s*release\s*\{)', text)
          if not release_block:
              raise SystemExit("Could not locate Android release build type for signing")
          tail = text[release_block.end():]
          if "signingConfig = signingConfigs.getByName(\"release\")" not in tail.split("}", 1)[0]:
              text = text[:release_block.end()] + '\n            signingConfig = signingConfigs.getByName("release")' + text[release_block.end():]
          text = re.sub(r'signingConfig\s*=\s*signingConfigs\.getByName\("debug"\)', 'signingConfig = signingConfigs.getByName("release")', text)
          if 'signingConfig = signingConfigs.getByName("release")' not in text:
              raise SystemExit("Permanent release signing was not configured")
          gradle.write_text(text)
          # Edit AndroidManifest.xml as XML, not string substitutions, to avoid malformed markup.
          import xml.etree.ElementTree as ET
          ET.register_namespace("android", "http://schemas.android.com/apk/res/android")
          ANDROID = "{http://schemas.android.com/apk/res/android}"
          manifest = Path("android/app/src/main/AndroidManifest.xml")
          tree = ET.parse(manifest)
          root = tree.getroot()
          for permission in ("android.permission.INTERNET", "android.permission.CAMERA"):
              if not any(item.get(ANDROID + "name") == permission for item in root.findall("uses-permission")):
                  root.insert(0, ET.Element("uses-permission", {ANDROID + "name": permission}))
          app = root.find("application")
          if app is None:
              raise SystemExit("AndroidManifest.xml has no application element")
          app.set(ANDROID + "label", "السوق العربي")
          app.set(ANDROID + "icon", "@drawable/market_launcher")
          activity = None
          for candidate in app.findall("activity"):
              names = [x.get(ANDROID + "name") for x in candidate.findall("intent-filter/action")]
              categories = [x.get(ANDROID + "name") for x in candidate.findall("intent-filter/category")]
              if "android.intent.action.MAIN" in names and "android.intent.category.LAUNCHER" in categories:
                  activity = candidate
                  break
          if activity is None:
              raise SystemExit("Could not locate the launcher activity in AndroidManifest.xml")
          has_deep_link = any(
              data.get(ANDROID + "scheme") == "jandaliarabmarket"
              and data.get(ANDROID + "host") == "login-callback"
              for filt in activity.findall("intent-filter")
              for data in filt.findall("data")
          )
          if not has_deep_link:
              filt = ET.SubElement(activity, "intent-filter")
              ET.SubElement(filt, "action", {ANDROID + "name": "android.intent.action.VIEW"})
              ET.SubElement(filt, "category", {ANDROID + "name": "android.intent.category.DEFAULT"})
              ET.SubElement(filt, "category", {ANDROID + "name": "android.intent.category.BROWSABLE"})
              ET.SubElement(filt, "data", {
                  ANDROID + "scheme": "jandaliarabmarket",
                  ANDROID + "host": "login-callback"
              })
          tree.write(manifest, encoding="utf-8", xml_declaration=True)
          # Parse the written file once more before Gradle starts.
          ET.parse(manifest)
          PY
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > release.keystore
          test -s release.keystore
          keytool -list -keystore release.keystore -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" >/dev/null
          echo "ANDROID_KEYSTORE_PATH=$PWD/release.keystore" >> "$GITHUB_ENV"

      - name: Install dependencies and analyze
        working-directory: html_wrapper
        run: |
          flutter pub get
          flutter analyze --no-fatal-infos

      - name: Build signed HTML marketplace APK or AAB
        working-directory: html_wrapper
        env:
          ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/html_wrapper/release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ "${{ inputs.format }}" = "aab" ]; then
            flutter build appbundle --release \
              --build-name=1.0.0 \
              --build-number=${{ github.run_number }}
            cp build/app/outputs/bundle/release/app-release.aab ../arab-market.aab
          else
            flutter build apk --release \
              --build-name=1.0.0 \
              --build-number=${{ github.run_number }}
            cp build/app/outputs/flutter-apk/app-release.apk ../arab-market.apk
          fi

      - name: Upload signed build as test artifact only (no Release)
        uses: actions/upload-artifact@v4
        with:
          name: arab-market-${{ inputs.format }}-test
          path: arab-market.${{ inputs.format }}
          if-no-files-found: error
          retention-days: 14
