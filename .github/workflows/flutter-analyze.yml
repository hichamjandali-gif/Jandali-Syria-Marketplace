name: Flutter source analysis (no APK)

on:
  push:
    branches: [main]
    paths:
      - 'flutter_app/**'
      - '.github/workflows/flutter-analyze.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Verify generated Android auth deep link (no APK)
        working-directory: flutter_app
        run: |
          flutter create --platforms=android --project-name jandali_market_native _android_scaffold
          python3 - <<'PY'
          from pathlib import Path
          manifest = Path("_android_scaffold/android/app/src/main/AndroidManifest.xml")
          content = manifest.read_text()
          intent = """            <intent-filter>
                          <action android:name="android.intent.action.VIEW" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <category android:name="android.intent.category.BROWSABLE" />
                          <data android:scheme="jandaliarabmarket" android:host="login-callback" />
                      </intent-filter>
          """
          if "jandaliarabmarket" not in content:
              if "</activity>" not in content:
                  raise SystemExit("MainActivity closing tag not found")
              content = content.replace("</activity>", intent + "            </activity>", 1)
              manifest.write_text(content)
          if "jandaliarabmarket" not in manifest.read_text():
              raise SystemExit("Auth deep link was not added")
          PY
          rm -rf _android_scaffold
      - name: Install dependencies
        working-directory: flutter_app
        run: flutter pub get
      - name: Analyze Dart source
        working-directory: flutter_app
        run: flutter analyze --no-fatal-infos
