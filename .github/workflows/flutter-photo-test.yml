name: Build Flutter photo test APK

on:
  push:
    branches: [main]
    paths:
      - 'flutter_app/**'
      - '.github/workflows/flutter-photo-test.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android platform scaffold
        working-directory: flutter_app
        run: |
          flutter create --platforms=android --project-name jandali_market_photo_test _android_scaffold
          cp -R _android_scaffold/android ./android
          cp _android_scaffold/.metadata .metadata
          rm -rf _android_scaffold
      - name: Install dependencies
        working-directory: flutter_app
        run: flutter pub get
      - name: Analyze
        working-directory: flutter_app
        run: flutter analyze --no-fatal-infos
      - name: Verify Supabase key is configured
        env:
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::Add SUPABASE_ANON_KEY in GitHub repository Actions secrets before building."
            exit 1
          fi
      - name: Build APK
        working-directory: flutter_app
        env:
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          flutter build apk --debug \
            --dart-define=SUPABASE_URL=https://xhyobwcaljmoakyvjajb.supabase.co \
            --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY"
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: jandali-photo-test-debug-apk
          path: flutter_app/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
