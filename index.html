<script>
/* Message composer: real external delivery only, never simulated replies. */
(function () {
  window.openSyrianMessageComposer = function (listing) {
    var prev = document.getElementById('syrian-message-composer');
    if (prev) prev.remove();
    var phone = String(listing && listing.phone || '').replace(/[^\d+]/g, '');
    var title = String(listing && listing.title || 'الإعلان');
    var overlay = document.createElement('div');
    overlay.id = 'syrian-message-composer';
    overlay.dir = 'rtl';
    overlay.setAttribute('role', 'dialog');
    overlay.setAttribute('aria-modal', 'true');
    overlay.setAttribute('aria-label', 'كتابة رسالة للبائع');
    overlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:2147483647;display:flex;align-items:center;justify-content:center;padding:16px;font-family:system-ui,sans-serif;';
    var panel = document.createElement('div');
    panel.style.cssText = 'background:white;border-radius:20px;padding:20px;width:100%;max-width:430px;box-shadow:0 12px 40px #0004;box-sizing:border-box;color:#222;';
    var heading = document.createElement('h2');
    heading.textContent = 'مراسلة كتابية';
    heading.style.cssText = 'font-size:20px;font-weight:800;margin:0 0 8px';
    var subtitle = document.createElement('p');
    subtitle.textContent = 'بخصوص: ' + title;
    subtitle.style.cssText = 'font-size:13px;margin:0 0 12px;color:#666';
    var textarea = document.createElement('textarea');
    textarea.placeholder = 'اكتب رسالتك إلى صاحب الإعلان هنا...';
    textarea.value = 'السلام عليكم، أريد الاستفسار عن: ' + title;
    textarea.style.cssText = 'display:block;width:100%;min-height:125px;border:1px solid #ccc;border-radius:12px;padding:12px;font:16px system-ui;resize:vertical;box-sizing:border-box;direction:rtl;color:#222;background:#fff';
    var note = document.createElement('p');
    note.textContent = 'ستُفتح الرسالة في واتساب أو تطبيق رسائل الهاتف. لن تُرسل تلقائياً؛ اضغط إرسال هناك.';
    note.style.cssText = 'font-size:12px;color:#666;line-height:1.8;margin:10px 0';
    var status = document.createElement('p');
    status.setAttribute('role','status');
    status.style.cssText = 'font-size:12px;color:#b42318;margin:0 0 8px';
    var actions = document.createElement('div');
    actions.style.cssText = 'display:flex;gap:8px;flex-wrap:wrap';
    function makeButton(text, background, color, click) {
      var btn = document.createElement('button');
      btn.type = 'button'; btn.textContent = text;
      btn.style.cssText = 'flex:1 1 95px;min-height:45px;padding:8px;border:0;border-radius:11px;font-size:14px;font-weight:800;background:' + background + ';color:' + color + ';cursor:pointer';
      btn.addEventListener('click', click);
      actions.appendChild(btn);
    }
    function getMessage() {
      var message = textarea.value.trim();
      if (!message) {status.textContent='اكتب الرسالة أولاً';textarea.focus();return null;}
      if (!phone) {status.textContent='لا يوجد رقم هاتف في الإعلان';return null;}
      return message;
    }
    function whatsappPhone() {
      var digits = phone.replace(/\D/g,'');
      if (digits.startsWith('00')) return digits.slice(2);
      if (digits.startsWith('0')) return '963' + digits.slice(1);
      return digits;
    }
    makeButton('إرسال عبر واتساب', '#25D366', '#fff', function () {
      var msg = getMessage(); if (msg === null) return;
      var number = whatsappPhone();
      var url = 'https://wa.me/' + number + '?text=' + encodeURIComponent(msg);
      window.location.href = url;
    });
    makeButton('إرسال SMS', '#222', '#fff', function () {
      var msg = getMessage(); if (msg === null) return;
      var separator = /iPad|iPhone|iPod/i.test(navigator.userAgent) ? '&' : '?';
      window.location.href = 'sms:' + phone + separator + 'body=' + encodeURIComponent(msg);
    });
    makeButton('إلغاء', '#eee', '#222', function () { overlay.remove(); });
    panel.append(heading, subtitle, textarea, note, status, actions);
    overlay.appendChild(panel);
    overlay.addEventListener('click', function (ev) {if (ev.target === overlay) overlay.remove();});
    document.body.appendChild(overlay);
    textarea.focus();
  };
})();
</script>

<script>
/* Real account settings and native sharing, with honest failure feedback. */
(function(){
  const APP_URL="https://hichamjandali-gif.github.io/Jandali-Syria-Marketplace/";
  const APP_TITLE="سوق هشام جندالي";
  async function copyLink(){
    if(navigator.clipboard && window.isSecureContext){
      await navigator.clipboard.writeText(APP_URL);
      return true;
    }
    const input=document.createElement("textarea");
    input.value=APP_URL;input.style.cssText="position:fixed;left:-9999px;top:0";
    document.body.appendChild(input);input.select();
    const ok=document.execCommand("copy");input.remove();
    if(!ok)throw new Error("copy unsupported");
    return true;
  }
  function feedback(message){window.alert(message)}
  window.jandaliShareApp=async function(){
    if(navigator.share){
      try{
        await navigator.share({title:APP_TITLE,text:"سوق مجاني للبيع والشراء في سوريا",url:APP_URL});
        return;
      }catch(err){
        if(err && err.name==="AbortError")return;
      }
    }
    try{await copyLink();feedback("تم نسخ رابط التطبيق. يمكنك لصقه في واتساب أو فيسبوك.");}
    catch(err){feedback("تعذر فتح المشاركة أو نسخ الرابط تلقائياً. الرابط:\n"+APP_URL)}
  };
  window.jandaliOpenSettings=function(){
    const previous=document.getElementById("jandali-settings-dialog");
    if(previous){previous.remove();return}
    const overlay=document.createElement("div");
    overlay.id="jandali-settings-dialog";overlay.dir="rtl";
    overlay.setAttribute("role","dialog");overlay.setAttribute("aria-modal","true");
    overlay.setAttribute("aria-label","الإعدادات");
    overlay.style.cssText="position:fixed;inset:0;z-index:2147483600;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:18px;font-family:system-ui,Tahoma,sans-serif";
    const panel=document.createElement("section");
    panel.style.cssText="width:100%;max-width:430px;max-height:85vh;overflow:auto;border-radius:20px;background:white;color:#222;padding:20px;box-sizing:border-box;box-shadow:0 15px 50px #0004";
    const heading=document.createElement("h2");heading.textContent="الإعدادات";heading.style.cssText="margin:0 0 16px;font-size:23px";
    const info=document.createElement("p");info.textContent="اللغة الحالية: العربية";info.style.cssText="margin:0 0 10px;font-size:15px";
    const privacy=document.createElement("p");privacy.textContent="الخصوصية: لا تشارك كلمة المرور أو معلومات الحساب مع الآخرين. لإدارة تسجيل الدخول استخدم زر إدارة الحساب.";privacy.style.cssText="margin:0 0 18px;font-size:14px;line-height:1.8;color:#555";
    function btn(label,fn){
      const b=document.createElement("button");b.type="button";b.textContent=label;
      b.style.cssText="display:block;width:100%;border:1px solid #c9dfca;background:#f3faf3;color:#237b32;border-radius:12px;padding:13px;margin-top:10px;font:bold 15px system-ui,Tahoma;cursor:pointer";
      b.addEventListener("click",fn);panel.appendChild(b);
    }
    panel.append(heading,info,privacy);
    btn("إدارة حسابي",()=>{overlay.remove();if(window.jandaliCloud && typeof window.jandaliCloud.account==="function")window.jandaliCloud.account();else feedback("إدارة الحساب غير متاحة حالياً")});
    btn("نسخ رابط التطبيق",async()=>{try{await copyLink();feedback("تم نسخ رابط التطبيق بنجاح")}catch(e){feedback("تعذر النسخ. الرابط:\n"+APP_URL)}});
    btn("إغلاق",()=>overlay.remove());
    overlay.appendChild(panel);document.body.appendChild(overlay);
    overlay.addEventListener("click",e=>{if(e.target===overlay)overlay.remove()});
    function esc(e){if(e.key==="Escape"){overlay.remove();document.removeEventListener("keydown",esc)}}
    document.addEventListener("keydown",esc);
  };
})();
</script>
