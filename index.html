<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#147a3c">
  <meta name="description" content="السوق العربي - حمل التطبيق الآن مجاناً للبيع والشراء والتواصل.">
  <title>السوق العربي - حمل التطبيق الآن مجاناً</title>
  <style>
    :root{color-scheme:light;font-family:Tahoma,Arial,sans-serif}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:22px;background:linear-gradient(145deg,#eff8f0,#dcefe0);color:#15321f}
    main{width:min(100%,480px);padding:30px 22px 26px;text-align:center;background:#fff;border:1px solid #d8eadb;border-radius:28px;box-shadow:0 20px 60px #173d2418}
    .brand-icon{width:170px;height:170px;display:block;margin:0 auto 8px;filter:drop-shadow(0 8px 12px #14532d22)}
    h1{margin:8px 0 8px;font-size:clamp(27px,7vw,35px);font-weight:900;color:#14532d}
    .subtitle{margin:0 0 24px;color:#53675a;font-size:17px;line-height:1.8}
    .download{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:58px;padding:14px 20px;border-radius:17px;background:#168044;color:#fff;text-decoration:none;font-size:20px;font-weight:900;box-shadow:0 8px 20px #16804435}
    .download:focus-visible{outline:4px solid #b8e6c4;outline-offset:3px}\n    .download.disabled{opacity:.68;cursor:default;pointer-events:none}
    .free{margin:15px 0 0;color:#287344;font-size:14px;font-weight:700}
    footer{margin-top:25px;color:#87958b;font-size:12px}
  </style>
</head>
<body>
  <main>
    <svg class="brand-icon" viewBox="0 0 180 180" role="img" aria-label="أيقونة السوق العربي الخضراء: منزل وسيارة وسلة">
      <defs>
        <linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#25a65a"/><stop offset="1" stop-color="#075b2c"/></linearGradient>
      </defs>
      <rect x="5" y="5" width="170" height="170" rx="42" fill="url(#g)"/>
      <path d="M31 79 68 47l37 32v43H31Z" fill="#fff"/>
      <path d="m23 80 45-39 45 39-8 9-37-32-37 32Z" fill="#d9f5df"/>
      <rect x="60" y="91" width="18" height="31" rx="3" fill="#168044"/>
      <rect x="85" y="91" width="13" height="13" rx="2" fill="#b8e9c5"/>
      <path d="M89 126h58l-8 22H99Z" fill="#f7fff8" stroke="#075b2c" stroke-width="4" stroke-linejoin="round"/>
      <path d="m99 126-7-20h49l-2 20M104 108l4 17m17-17-1 17" fill="none" stroke="#075b2c" stroke-width="4" stroke-linecap="round"/>
      <path d="M108 87h29a8 8 0 0 1 8 8v13h-45V95a8 8 0 0 1 8-8Z" fill="#ffd34e"/>
      <path d="m105 87 7-10h19l7 10" fill="#fff0b4"/>
      <path d="M100 111h47" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
      <circle cx="110" cy="151" r="6" fill="#fff"/><circle cx="139" cy="151" r="6" fill="#fff"/>
    </svg>
    <h1>السوق العربي</h1>
    <p class="subtitle">حمل التطبيق الآن مجاناً</p>
    <a id="download" class="download disabled" href="#" aria-disabled="true" aria-label="تحميل التطبيق">
      <span aria-hidden="true">⬇</span><span id="download-label">تحميل التطبيق — قريباً</span>
    </a>
    <p class="free" id="release-status">سيُفعّل رابط التحميل تلقائياً عند نشر النسخة الرسمية v1.0</p>
    <footer>السوق العربي · By Hicham Jandali</footer>
  </main>
  <script>
    const releaseApi = "https://api.github.com/repos/hichamjandali-gif/Jandali-Syria-Marketplace/releases/latest";
    const downloadUrl = "https://github.com/hichamjandali-gif/Jandali-Syria-Marketplace/releases/latest/download/arab-market.apk";
    fetch(releaseApi, {headers: {Accept: "application/vnd.github+json"}, cache: "no-store"})
      .then(response => { if (!response.ok) throw new Error("No published release"); return response.json(); })
      .then(release => {
        const apk = (release.assets || []).find(asset => asset.name === "arab-market.apk");
        if (!apk) throw new Error("APK asset not published");
        const button = document.getElementById("download");
        button.href = downloadUrl;
        button.classList.remove("disabled");
        button.setAttribute("aria-disabled", "false");
        document.getElementById("download-label").textContent = "تحميل التطبيق";
        document.getElementById("release-status").textContent = "الإصدار الرسمي " + release.tag_name + " — مجاني";
      })
      .catch(() => {
        document.getElementById("release-status").textContent = "سيُفعّل رابط التحميل تلقائياً عند نشر النسخة الرسمية v1.0";
      });
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./sw.js").catch(() => {});
      });
    }
  </script>
</body>
</html>
