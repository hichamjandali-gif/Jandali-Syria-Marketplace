<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#167a3e">
  <meta name="description" content="السوق العربي - تطبيق سهل للبيع والشراء والتواصل.">
  <title>السوق العربي - حمل التطبيق الجديد</title>
  <style>
    :root{color-scheme:light;font-family:Tahoma,Arial,sans-serif}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:linear-gradient(145deg,#f3f8f3,#e8f1e9);color:#17251b}
    main{width:min(100%,520px);padding:36px 26px;text-align:center;background:#fff;border:1px solid #dce8dd;border-radius:24px;box-shadow:0 18px 55px #173d2412}
    .mark{width:76px;height:76px;margin:0 auto 18px;display:grid;place-items:center;border-radius:22px;background:#e8f5eb;color:#167a3e;font-size:38px}
    h1{margin:0 0 12px;font-size:clamp(25px,6vw,34px);font-weight:900}
    p{font-size:16px;line-height:1.9;color:#526258}
    .notice{margin:26px 0 12px;padding:18px 14px;border:1px solid #e5d7a8;border-radius:15px;background:#fff9e8;color:#735b17;font-size:17px;font-weight:800;line-height:1.8}
    footer{margin-top:24px;color:#839087;font-size:12px}
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">س</div>
    <h1>السوق العربي</h1>
    <p>حمّل التطبيق الجديد قريباً، وتواصل للبيع والشراء والإعلانات من هاتفك بسهولة.</p>
    <div class="notice">سيتوفر رابط التحميل الدائم قريباً</div>
    <p>نجهّز رابطاً رسمياً ثابتاً وآمناً. لا تستخدم روابط تنزيل غير رسمية.</p>
    <footer>السوق العربي · النسخة الجديدة</footer>
  </main>
</body>
</html>
