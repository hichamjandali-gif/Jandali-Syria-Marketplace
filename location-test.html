<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>تجربة الموقع – السوق العربي</title><style>body{font-family:system-ui;background:#f5f7f5;color:#16251b;margin:0}main{max-width:650px;margin:auto;padding:18px}h1{font-size:23px}section{background:white;border-radius:16px;padding:16px;margin:14px 0;box-shadow:0 2px 8px #0001}input,button,select{box-sizing:border-box;font:inherit;padding:12px;border-radius:10px;border:1px solid #c8d7cc;margin:6px 0;width:100%}button{background:#267b3b;color:white;border:0;font-weight:700}button.secondary{background:#e8f4eb;color:#17592c}.muted{color:#647568;font-size:13px}.result{padding:9px;border-bottom:1px solid #ddd;cursor:pointer}.result:hover{background:#edf7ef}.item{padding:10px;border-bottom:1px solid #eee}.warning{background:#fff6dd;padding:12px;border-radius:10px}</style><main><h1>السوق العربي — تجربة اختيار المنطقة والبحث</h1><p class="warning">نسخة تجريبية مستقلة. الإعلانات هنا محفوظة على هذا الجهاز فقط، ولا تظهر للمستخدمين الآخرين. لم نغيّر التطبيق الأصلي.</p><section><h2>١. موقع الإعلان</h2><button id="gps">📍 تحديد موقعي من الهاتف</button><label>أو اكتب مدينة / حي / بلد</label><input id="place" placeholder="مثلاً: القابون، دمشق أو كاسل، ألمانيا"><button class="secondary" id="lookup">البحث عن المنطقة</button><div id="choices"></div><p id="selected" class="muted">لم يُحدد موقع بعد</p><input id="title" placeholder="اسم الغرض المعروض"><button id="post">نشر إعلان تجريبي</button></section><section><h2>٢. البحث عن الإعلانات</h2><input id="q" placeholder="القابون أو دمشق أو كاسل"><button id="search">بحث بالاسم</button><p class="muted">يمكنك البحث باسم الحي حتى لو كنت موجوداً في دولة أخرى.</p><div id="items"></div></section></main><script>
const $=id=>document.getElementById(id);let chosen=null;const key='arabmarket-location-test-v1';let ads=JSON.parse(localStorage.getItem(key)||'[]');const norm=s=>(s||'').toLowerCase().normalize('NFKD').replace(/[\u064b-\u065f\u0670]/g,'').replace(/[أإآ]/g,'ا').replace(/ة/g,'ه').replace(/ى/g,'ي').trim();const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function setPlace(p){chosen=p;$('selected').textContent='الموقع المحدد: '+p.label;$('choices').innerHTML=''}async function lookup(){let q=$('place').value.trim();if(!q)return alert('اكتب المنطقة');$('choices').textContent='جاري البحث...';try{let u='https://nominatim.openstreetmap.org/search?format=jsonv2&addressdetails=1&limit=6&accept-language=ar&q='+encodeURIComponent(q);let res=await fetch(u);if(!res.ok)throw Error('فشل الاتصال');let places=await res.json();$('choices').innerHTML='';if(!places.length){$('choices').textContent='لم نجد المنطقة. جرّب إضافة اسم المدينة والبلد';return}places.forEach(p=>{let b=document.createElement('button');b.className='secondary';b.textContent=p.display_name;b.onclick=()=>setPlace({label:p.display_name,lat:+p.lat,lon:+p.lon});$('choices').appendChild(b)})}catch(e){$('choices').textContent='تعذر البحث الآن. حاول لاحقاً.'}}$('lookup').onclick=lookup;$('gps').onclick=()=>{if(!navigator.geolocation)return alert('تحديد الموقع غير متاح');navigator.geolocation.getCurrentPosition(async p=>{let lat=p.coords.latitude,lon=p.coords.longitude;let label=lat.toFixed(4)+', '+lon.toFixed(4);try{let r=await fetch('https://nominatim.openstreetmap.org/reverse?format=jsonv2&accept-language=ar&lat='+lat+'&lon='+lon);if(r.ok){let d=await r.json();label=d.display_name||label}}catch(e){}setPlace({label,lat,lon})},()=>alert('تعذر تحديد الموقع. يمكنك كتابته يدوياً.'),{timeout:12000})};$('post').onclick=()=>{let title=$('title').value.trim();if(!title||!chosen)return alert('اكتب اسم الغرض وحدد موقعه أولاً');ads.push({title,...chosen});localStorage.setItem(key,JSON.stringify(ads));$('title').value='';alert('حُفظ الإعلان التجريبي على جهازك فقط');render()};function render(){let q=norm($('q').value);let hits=ads.filter(a=>!q||norm(a.label).includes(q)||norm(a.title).includes(q));$('items').innerHTML=hits.length?hits.map(a=>'<div class="item"><b>'+esc(a.title)+'</b><p>'+esc(a.label)+'</p></div>').join(''):'لا توجد إعلانات مطابقة في هذه النسخة التجريبية'}$('search').onclick=render;$('q').oninput=render;render();
</script></html>
