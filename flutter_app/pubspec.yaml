name: jandali_market_photo_test
description: Native Flutter Arabic marketplace using the existing Supabase project.
publish_to: "none"
version: 0.2.0+2

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  image_picker: ^1.1.2
  supabase_flutter: ^2.5.0
  mime: ^2.0.0
  flutter_image_compress: ^2.5.1
  uuid: ^4.5.1
  shared_preferences: ^2.5.3
  flutter_map: ^8.1.1
  latlong2: ^0.9.1
  geolocator: ^14.0.2
  http: ^1.4.0
  url_launcher: ^6.3.2
  flutter_tts: ^4.2.3
  speech_to_text: ^7.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
