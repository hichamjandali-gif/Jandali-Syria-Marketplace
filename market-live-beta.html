<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>سوق السوريين - اختبار الربط الحقيقي</title>
<style>body{margin:0;background:#f6f7f6;color:#202520;font:16px system-ui,Tahoma}header{background:#fff;padding:18px;border-bottom:2px solid #48af57}h1{margin:0;font-size:23px}small{color:#677}main{max-width:760px;margin:auto;padding:14px}nav{display:flex;gap:7px;overflow:auto;position:sticky;top:0;background:#f6f7f6;padding:10px 0}button{border:1px solid #ddd;background:white;padding:11px 14px;border-radius:12px;font:inherit;cursor:pointer}button.primary{background:#39a64d;color:white;border:0}button.danger{color:#b22}input,textarea,select{box-sizing:border-box;width:100%;font:inherit;border:1px solid #ccd4cc;border-radius:10px;padding:12px;margin:6px 0 12px;background:#fff}textarea{min-height:90px}.card{background:#fff;padding:16px;margin:12px 0;border:1px solid #e4e8e4;border-radius:16px}.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.row>*{flex-shrink:0}.muted{color:#667;font-size:13px}.photo{width:100%;max-height:280px;object-fit:cover;border-radius:10px}.hidden{display:none}.bubble{background:#e8f5e9;padding:10px;margin:8px 0;border-radius:10px;max-width:85%}.mine{background:#e1efff;margin-right:auto}#notice{padding:10px;color:#9a4300}label{display:block;font-weight:650}</style>
</head><body><header><h1>🛍️ سوق السوريين – جندالي</h1><small>نسخة اختبار الربط الحقيقي – لا إعلانات وهمية</small></header><main><div id="notice" role="status"></div><div id="auth"></div><nav id="nav"><button data-page="browse">السوق</button><button data-page="new">أضف إعلانك</button><button data-page="mine">إعلاناتي</button><button data-page="chats">الرسائل الخاصة</button><button data-page="account">حسابي</button></nav><section id="view"></section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.min.js"></script>
<script>
"use strict";
const API="https://xhyobwcaljmoakyvjajb.supabase.co",KEY="sb_publishable_ck3rZzTMrKcdfMSKRj-N_w_Ij_oOHJP";
const db=window.supabase?.createClient(API,KEY,{auth:{persistSession:true,autoRefreshToken:true}});
const $=id=>document.getElementById(id),esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let user=null,page="browse",currentChat=null,activeListing=null,refreshTimer=null;
function say(msg){$("notice").textContent=msg||""}
function err(e){say("⚠️ "+(e?.message||e||"حدث خطأ"))}
function requireUser(){if(!user){say("سجّل الدخول أولاً لإكمال العملية");return false}return true}
function input(id,label,type="text",required=true){return '<label for="'+id+'">'+label+'</label><input id="'+id+'" type="'+type+'" '+(required?"required":"")+">"}
function htmlListing(x,owner=false){let imgs=Array.isArray(x.photo_urls)?x.photo_urls:[];return '<article class="card">'+(imgs[0]?'<img class="photo" loading="lazy" src="'+esc(imgs[0])+'" alt="صورة الإعلان">':"")+'<h3>'+esc(x.title)+'</h3><p>'+esc(x.description)+'</p><p>📍 '+esc(x.city)+' · '+esc(x.category)+' · '+(x.price==null?"السعر عند التواصل":esc(x.price)+" "+esc(x.currency))+'</p><small>'+esc(x.status==="closed"?"منتهي":"نشط")+'</small><div class="row">'+(owner?'<button data-action="close" data-id="'+esc(x.id)+'">تم البيع / انتهى الطلب</button><button class="danger" data-action="delete" data-id="'+esc(x.id)+'">حذف</button>':user&&user.id!==x.owner_id?'<button class="primary" data-action="contact" data-id="'+esc(x.id)+'">راسل البائع داخل السوق</button>':"")+'</div></article>'}
async function setPage(p){page=p;currentChat=null;clearInterval(refreshTimer);say("");if(p==="browse")return browse();if(p==="new")return newForm();if(p==="mine")return mine();if(p==="chats")return chats();if(p==="account")return account()}
async function browse(){let {data,error}=await db.from("market_listings").select("*").eq("status","active").order("created_at",{ascending:false}).limit(100);if(error)return err(error);$("view").innerHTML="<h2>إعلانات السوق</h2>"+(data.length?data.map(x=>htmlListing(x)).join(""):'<div class="card">لا توجد إعلانات حقيقية منشورة بعد.</div>')}
function newForm(){if(!requireUser())return;$("view").innerHTML='<div class="card"><h2>نشر إعلان حقيقي</h2><form id="listingForm">'+input("title","عنوان الإعلان")+ '<label>التفاصيل</label><textarea id="description" required minlength="3"></textarea>'+input("category","القسم")+input("city","المدينة")+input("price","السعر (اختياري)","number",false)+'<label>العملة</label><select id="currency"><option>SYP</option><option>USD</option></select><label>صور من الاستديو</label><input id="photos" type="file" accept="image/*,.heic,.heif" multiple><label>أو التقاط صورة بالكاميرا</label><input id="camera" type="file" accept="image/*" capture="environment"><button class="primary" type="submit">نشر الإعلان</button></form></div>';$("listingForm").onsubmit=publish}
async function jpeg(file){if(file.type==="image/jpeg"||file.type==="image/png"||file.type==="image/webp")return file;throw Error("صيغة "+file.name+" غير مدعومة هنا. حوّل HEIC إلى JPEG قبل الرفع.")}
async function publish(ev){ev.preventDefault();if(!requireUser())return;let b=ev.submitter;b.disabled=true;try{let title=$("title").value.trim(),description=$("description").value.trim(),category=$("category").value.trim(),city=$("city").value.trim(),price=$("price").value;if(title.length<3||description.length<3||category.length<2||city.length<2)throw Error("أكمل بيانات الإعلان");let files=[...$("photos").files,...$("camera").files];if(files.length>6)throw Error("الحد الأقصى 6 صور");let urls=[];for(let f of files){f=await jpeg(f);if(f.size>8*1024*1024)throw Error("الصورة أكبر من 8 ميغابايت");let name=user.id+"/"+crypto.randomUUID()+"."+((f.type==="image/png")?"png":f.type==="image/webp"?"webp":"jpg");let {error}=await db.storage.from("market-photos").upload(name,f,{contentType:f.type,upsert:false});if(error)throw error;urls.push(db.storage.from("market-photos").getPublicUrl(name).data.publicUrl)}let {error}=await db.from("market_listings").insert({owner_id:user.id,title,description,category,city,price:price===""?null:Number(price),currency:$("currency").value,photo_urls:urls});if(error)throw error;say("تم نشر الإعلان في قاعدة البيانات");await setPage("mine")}catch(e){err(e)}finally{b.disabled=false}}
async function mine(){if(!requireUser())return;let {data,error}=await db.from("market_listings").select("*").eq("owner_id",user.id).order("created_at",{ascending:false});if(error)return err(error);$("view").innerHTML="<h2>إعلاناتي</h2>"+(data.length?data.map(x=>htmlListing(x,true)).join(""):'<div class="card">لم تنشر إعلانات بعد.</div>')}
async function closeListing(id){if(!confirm("إنهاء الإعلان وإخفاؤه من السوق؟"))return;let {error}=await db.from("market_listings").update({status:"closed"}).eq("id",id).eq("owner_id",user.id);if(error)return err(error);mine()}
async function deleteListing(id){if(!confirm("حذف إعلانك نهائياً؟ ستُحذف المحادثات المرتبطة به أيضاً."))return;let {error}=await db.from("market_listings").delete().eq("id",id).eq("owner_id",user.id);if(error)return err(error);mine()}
async function contact(id){if(!requireUser())return;let {data:listing,error:e}=await db.from("market_listings").select("*").eq("id",id).single();if(e)return err(e);if(listing.owner_id===user.id)return say("لا يمكنك مراسلة نفسك");let {data:existing,error}=await db.from("market_conversations").select("id").eq("listing_id",id).eq("buyer_id",user.id).maybeSingle();if(error)return err(error);let cid=existing?.id;if(!cid){let created=await db.from("market_conversations").insert({listing_id:id,buyer_id:user.id,seller_id:listing.owner_id}).select("id").single();if(created.error){let retry=await db.from("market_conversations").select("id").eq("listing_id",id).eq("buyer_id",user.id).maybeSingle();if(retry.error||!retry.data)return err(created.error);cid=retry.data.id}else cid=created.data.id}openChat(cid)}
async function chats(){if(!requireUser())return;let {data,error}=await db.from("market_conversations").select("id,listing_id,buyer_id,seller_id,created_at").or("buyer_id.eq."+user.id+",seller_id.eq."+user.id).order("created_at",{ascending:false});if(error)return err(error);let listingIds=[...new Set(data.map(x=>x.listing_id))];let titles={};if(listingIds.length){let r=await db.from("market_listings").select("id,title").in("id",listingIds);if(r.error)return err(r.error);for(let l of r.data)titles[l.id]=l.title}$("view").innerHTML="<h2>رسائلي الخاصة</h2>"+(data.length?data.map(x=>'<div class="card"><b>'+esc(titles[x.listing_id]||"إعلان")+'</b><p class="muted">محادثة خاصة بين البائع والمشتري</p><button data-action="chat" data-id="'+esc(x.id)+'">فتح المحادثة</button></div>').join(""):'<div class="card">لا توجد رسائل بعد.</div>')}
async function openChat(id){if(!requireUser())return;currentChat=id;page="chat";clearInterval(refreshTimer);$("view").innerHTML='<button data-page="chats">رجوع للرسائل</button><h2>محادثة خاصة</h2><div id="thread"></div><form id="sendForm"><textarea id="message" maxlength="3000" placeholder="اكتب رسالتك..." required></textarea><button class="primary">إرسال داخل السوق</button></form>';$("sendForm").onsubmit=sendMessage;await loadMessages();refreshTimer=setInterval(()=>{if(currentChat===id)loadMessages()},6000)}
async function loadMessages(){if(!currentChat)return;let {data,error}=await db.from("market_messages").select("id,sender_id,body,created_at").eq("conversation_id",currentChat).order("created_at",{ascending:true}).limit(200);if(error)return err(error);let target=$("thread");if(target)target.innerHTML=data.map(x=>'<div class="bubble '+(x.sender_id===user.id?"mine":"")+'">'+esc(x.body)+'<p class="muted">'+esc(new Date(x.created_at).toLocaleString("ar"))+'</p></div>').join("")||'<p>ابدأ المحادثة برسالة.</p>'}
async function sendMessage(e){e.preventDefault();let body=$("message").value.trim();if(!body)return;let {error}=await db.from("market_messages").insert({conversation_id:currentChat,sender_id:user.id,body});if(error)return err(error);$("message").value="";loadMessages()}
function account(){$("view").innerHTML='<div class="card"><h2>حسابي</h2>'+(user?'<p>'+esc(user.email||user.id)+'</p><button id="signout">تسجيل الخروج</button>':'<p>سجّل الدخول لمتابعة إعلاناتك ورسائلك.</p>')+'</div>';if(user)$("signout").onclick=()=>db.auth.signOut()}
function authView(){$("auth").innerHTML=user?'<div class="muted">🔒 الحساب: '+esc(user.email||user.id)+'</div>':'<div class="card"><h3>الدخول أو إنشاء حساب</h3><form id="loginForm">'+input("email","البريد الإلكتروني","email")+input("password","كلمة المرور (6 أحرف على الأقل)","password")+'<button type="button" id="togglePassword" aria-label="إظهار كلمة المرور" aria-pressed="false">👁️ إظهار كلمة المرور</button><div class="row"><button class="primary" type="submit" data-kind="login">دخول</button><button type="submit" data-kind="signup">حساب جديد</button></div></form><p class="muted">قد يلزم تأكيد البريد الإلكتروني قبل الدخول.</p></div>' ;if(!user)$("togglePassword").onclick=()=>{let field=$("password"),button=$("togglePassword"),show=field.type==="password";field.type=show?"text":"password";button.textContent=show?"🙈 إخفاء كلمة المرور":"👁️ إظهار كلمة المرور";button.setAttribute("aria-pressed",String(show))};if(!user)$("loginForm").onsubmit=async e=>{e.preventDefault();let kind=e.submitter.dataset.kind,email=$("email").value,password=$("password").value;let r=kind==="signup"?await db.auth.signUp({email,password}):await db.auth.signInWithPassword({email,password});if(r.error){if(/email not confirmed/i.test(r.error.message||""))return say("⚠️ لم يتم تأكيد البريد الإلكتروني. افتح رسالة التأكيد في بريدك، ثم جرّب الدخول.");return err(r.error)}say(kind==="signup"?"تحقق من بريدك إذا طُلب تأكيد الحساب":"تم تسجيل الدخول")}}
document.addEventListener("click",async e=>{let b=e.target.closest("button");if(!b)return;if(b.dataset.page)return setPage(b.dataset.page);let id=b.dataset.id;if(b.dataset.action==="contact")return contact(id);if(b.dataset.action==="close")return closeListing(id);if(b.dataset.action==="delete")return deleteListing(id);if(b.dataset.action==="chat")return openChat(id)});
(async()=>{if(!db){say("تعذر تحميل مكتبة الاتصال بقاعدة البيانات");return}let r=await db.auth.getUser();user=r.data.user;authView();db.auth.onAuthStateChange((_event,session)=>{user=session?.user||null;authView();setPage("browse")});await setPage("browse")})();
</script></body></html>
