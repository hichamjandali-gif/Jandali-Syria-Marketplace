<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>اختبار صور سوق جندلي</title><style>body{font:16px system-ui;background:#f5f6f7;color:#17202a;padding:18px;max-width:600px;margin:auto}button{padding:17px;border:0;border-radius:12px;background:#166534;color:white;font-size:17px;width:100%;margin:8px 0}button.gallery{background:#1e40af}section{background:white;padding:16px;border-radius:14px;margin:15px 0}img{max-width:100%;max-height:360px;object-fit:contain;border-radius:12px}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:14px}small{color:#555}</style></head><body><h2>اختبار الكاميرا والصور — جندلي</h2><p>صفحة اختبار مستقلة. لا تنشر إعلاناً ولا ترسل الصور إلى خادم.</p><section><button id="cam">📷 التقاط صورة بالكاميرا</button><button id="gal" class="gallery">🖼️ اختيار صورة من المعرض</button><input id="cameraInput" type="file" accept="image/*" capture="environment" style="position:absolute;width:1px;height:1px;opacity:0;pointer-events:none"><input id="galleryInput" type="file" accept="image/*" style="position:absolute;width:1px;height:1px;opacity:0;pointer-events:none"><small>اختبر الزرين بصورة واحدة في كل مرة.</small></section><section><strong>نتيجة الاختبار:</strong><pre id="status">لم تُختر صورة بعد.</pre><img id="preview" hidden alt="معاينة الصورة"></section><script>const status=document.getElementById('status'),preview=document.getElementById('preview');document.getElementById('cam').onclick=()=>{status.textContent='طلب فتح الكاميرا…';document.getElementById('cameraInput').click()};document.getElementById('gal').onclick=()=>{status.textContent='طلب فتح المعرض…';document.getElementById('galleryInput').click()};async function picked(e){const f=e.target.files?.[0];if(!f){status.textContent='لم يرجع ملف من الهاتف.';return}const info='الاسم: '+f.name+'\nالنوع: '+(f.type||'غير معروف')+'\nالحجم: '+(f.size/1024/1024).toFixed(2)+' MB';status.textContent=info+'\nجاري محاولة العرض…';preview.hidden=true;const url=URL.createObjectURL(f);const im=new Image();im.onload=()=>{status.textContent=info+'\n✅ المتصفح استطاع قراءة الصورة ('+im.naturalWidth+' × '+im.naturalHeight+')';preview.src=url;preview.hidden=false};im.onerror=()=>{URL.revokeObjectURL(url);status.textContent=info+'\n❌ المتصفح لم يستطع قراءة الصورة. قد تكون الصيغة غير مدعومة.'};im.src=url;e.target.value=''}document.getElementById('cameraInput').addEventListener('change',picked);document.getElementById('galleryInput').addEventListener('change',picked);</script></body></html>
