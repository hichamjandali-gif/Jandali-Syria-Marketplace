<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>اختبار صور سوق جندلي</title><style>body{font:16px system-ui;background:#f5f6f7;color:#17202a;padding:18px;max-width:600px;margin:auto}button{padding:17px;border:0;border-radius:12px;background:#166534;color:white;font-size:17px;width:100%;margin:8px 0}button.gallery{background:#1e40af}section{background:white;padding:16px;border-radius:14px;margin:15px 0}img{max-width:100%;max-height:360px;object-fit:contain;border-radius:12px}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:14px}small{color:#555}</style><script src="https://cdn.jsdelivr.net/npm/heic2any@0.0.4/dist/heic2any.min.js" onload="window.heicLibraryStatus='loaded'" onerror="window.heicLibraryStatus='failed'"></script></head><body><h2>اختبار الكاميرا والصور — جندلي</h2><p style="color:#166534;font-weight:bold">الإصدار التشخيصي 3 — فحص HEIC</p><p>صفحة اختبار مستقلة. لا تنشر إعلاناً ولا ترسل الصور إلى خادم.</p><section><button id="cam">📷 التقاط صورة بالكاميرا</button><button id="gal" class="gallery">🖼️ اختيار صورة من المعرض</button><input id="cameraInput" type="file" accept="image/*" capture="environment" style="position:absolute;width:1px;height:1px;opacity:0;pointer-events:none"><input id="galleryInput" type="file" accept="image/*" style="position:absolute;width:1px;height:1px;opacity:0;pointer-events:none"><small>اختبر الزرين بصورة واحدة في كل مرة.</small></section><section><strong>نتيجة الاختبار:</strong><pre id="status">لم تُختر صورة بعد.</pre><img id="preview" hidden alt="معاينة الصورة"></section><script>const status=document.getElementById('status'),preview=document.getElementById('preview');document.getElementById('cam').onclick=()=>{status.textContent='طلب فتح الكاميرا…';document.getElementById('cameraInput').click()};document.getElementById('gal').onclick=()=>{status.textContent='طلب فتح المعرض…';document.getElementById('galleryInput').click()};async function picked(e){const f=e.target.files?.[0];if(!f){status.textContent='لم يرجع ملف من الهاتف.';return}const info='الاسم: '+f.name+'\nالنوع: '+(f.type||'غير معروف')+'\nالحجم: '+(f.size/1024/1024).toFixed(2)+' MB';status.textContent=info+'\nجاري محاولة العرض…';preview.hidden=true;const url=URL.createObjectURL(f);const im=new Image();im.onload=()=>{status.textContent=info+'\n✅ المتصفح استطاع قراءة الصورة ('+im.naturalWidth+' × '+im.naturalHeight+')';preview.src=url;preview.hidden=false};im.onerror=async()=>{URL.revokeObjectURL(url);if(!/\.(heic|heif)$/i.test(f.name)&&!/heic|heif/i.test(f.type)){status.textContent=info+'\n❌ فشل فك الصورة؛ الملف ليس HEIC حسب الاسم والنوع.';return}status.textContent=info+'\nHEIC: محاولة التحويل…\\nالمكتبة: '+(typeof window.heic2any)+' / '+(window.heicLibraryStatus||'لم يكتمل التحميل');try{if(typeof window.heic2any!=='function')throw Error('مكتبة التحويل غير متاحة؛ تحقق من الإنترنت أو حظر CDN');const typed=f.slice(0,f.size,'image/heic');const output=await window.heic2any({blob:typed,toType:'image/jpeg',quality:0.8});const jpeg=Array.isArray(output)?output[0]:output;const jpegUrl=URL.createObjectURL(jpeg);const verify=new Image();verify.onload=()=>{preview.src=jpegUrl;preview.hidden=false;status.textContent=info+'\n✅ نجح تحويل HEIC إلى JPEG وعرضها ('+verify.naturalWidth+' × '+verify.naturalHeight+')'};verify.onerror=()=>{URL.revokeObjectURL(jpegUrl);status.textContent=info+'\n❌ التحويل أعاد ملفاً لا يستطيع المتصفح عرضه'};verify.src=jpegUrl}catch(err){status.textContent=info+'\n❌ فشل تحويل HEIC: '+(err&&err.message?err.message:String(err))+'\nالمكتبة: '+typeof window.heic2any}};im.src=url;e.target.value=''}document.getElementById('cameraInput').addEventListener('change',picked);document.getElementById('galleryInput').addEventListener('change',picked);</script></body></html>
