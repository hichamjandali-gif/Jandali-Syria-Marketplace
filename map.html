<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>خريطة السوق العربي</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css" crossorigin="" onerror="this.onerror=null;this.href='https://unpkg.com/leaflet@1.9.4/dist/leaflet.css'">
  <style>
    html,body,#map{width:100%;height:100%;margin:0;padding:0;background:#e8eaed}
    body{overflow:hidden;font-family:system-ui,Tahoma,sans-serif}
    #map{position:absolute;inset:0}
    .map-error{position:absolute;z-index:1000;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center;background:#f4f5f6;color:#4b5563;font-weight:700;line-height:1.8}
    .leaflet-control-attribution{font-size:10px!important}
    .osm-fallback{position:absolute;inset:0;overflow:hidden;background:#e8eaed}
    .osm-fallback iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
    .osm-radius{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);border:3px solid #1683ff;background:rgba(22,131,255,.16);border-radius:50%;pointer-events:none;box-shadow:0 0 0 1px #fff8}
    .osm-caption{position:absolute;bottom:5px;left:5px;background:#fffD;border-radius:5px;padding:3px 6px;font:10px system-ui;color:#333;z-index:5}
  </style>
</head>
<body>
  <div id="map" role="application" aria-label="خريطة OpenStreetMap"></div>
  <div id="error" class="map-error" hidden>تعذر تحميل مكتبة الخريطة. ما زال بإمكانك اختيار المدينة وتأكيد الموقع.</div>
  <script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js" crossorigin="" onerror="this.onerror=null;const fallback=document.createElement('script');fallback.src='https://unpkg.com/leaflet@1.9.4/dist/leaflet.js';document.head.appendChild(fallback)"></script>
  <script>
    (function(){
      const params=new URLSearchParams(location.search);
      const lat=Number(params.get("lat"));
      const lon=Number(params.get("lon"));
      const radius=Math.max(1,Math.min(50,Number(params.get("radius"))||5))*1000;
      const error=document.getElementById("error");
      if(!Number.isFinite(lat)||!Number.isFinite(lon)||Math.abs(lat)>90||Math.abs(lon)>180){
        error.hidden=false;
        error.textContent="اختر مدينة من مربع البحث لعرض الخريطة.";
        return;
      }
      const radiusKm=radius/1000;
      if(typeof L==="undefined"){
        const viewRadiusKm=50;
        const latPad=viewRadiusKm/111;
        const lonPad=viewRadiusKm/(111*Math.max(0.25,Math.cos(lat*Math.PI/180)));
        const west=lon-lonPad,south=lat-latPad,east=lon+lonPad,north=lat+latPad;
        const bbox=[west,south,east,north].map(v=>v.toFixed(6)).join(",");
        const circleSize=Math.max(12,Math.min(window.innerWidth,window.innerHeight)*radiusKm/viewRadiusKm);
        document.getElementById("map").innerHTML=
          '<div class="osm-fallback"><iframe title="OpenStreetMap" loading="eager" referrerpolicy="strict-origin-when-cross-origin" src="https://www.openstreetmap.org/export/embed.html?bbox='+encodeURIComponent(bbox)+'&layer=mapnik&marker='+encodeURIComponent(lat+','+lon)+'"></iframe><div class="osm-radius" style="width:'+circleSize+'px;height:'+circleSize+'px"></div><div class="osm-caption">© OpenStreetMap • نطاق '+radiusKm+' كم</div></div>';
        return;
      }
      const map=L.map("map",{zoomControl:true,scrollWheelZoom:true}).setView([lat,lon],10);
      L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",{
        maxZoom:19,
        attribution:'© <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a>'
      }).addTo(map);
      L.marker([lat,lon]).addTo(map);
      L.circle([lat,lon],{radius:radius,color:"#1683ff",weight:3,fillColor:"#1683ff",fillOpacity:.16}).addTo(map);
      setTimeout(()=>map.invalidateSize(true),250);
      window.addEventListener("resize",()=>map.invalidateSize());
    })();
  </script>
</body>
</html>
